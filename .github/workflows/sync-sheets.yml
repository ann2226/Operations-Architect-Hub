name: Sync spreadsheets

on:
  schedule:
    - cron: "0 11 * * *" # every day, 11:00 UTC (7 AM US Eastern / 7 PM Manila)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish client data from a public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::Repository is public. Make it private before syncing client data."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client==2.151.0 google-auth==2.36.0 openpyxl==3.1.5

      - name: Export spreadsheets
        id: export
        continue-on-error: true # still commit the sources that worked
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_sheets.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- 'data/**/*.csv' && \
             [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No changes since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898613+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Sync spreadsheets ($(date -u +%Y-%m-%d))"
          git push

      - name: Fail the run if any source failed
        if: steps.export.outcome == 'failure'
        run: exit 1
