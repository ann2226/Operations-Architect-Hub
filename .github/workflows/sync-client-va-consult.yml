name: Sync Client & VA Consult sheet

on:
  schedule:
    - cron: "0 11 * * *" # every day, 11:00 UTC (7 AM US Eastern / 7 PM Manila)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-client-va-consult
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish client data from a public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)
          if [ "$private" != "true" ]; then
            echo "::error::Repository is public. Make it private before syncing client data."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client==2.151.0 google-auth==2.36.0

      - name: Export sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_client_va_consult.py

      - name: Commit if the sheet changed
        run: |
          if git diff --quiet -- data/client-va-consult/*.csv && \
             [ -z "$(git ls-files --others --exclude-standard data/client-va-consult)" ]; then
            echo "No changes in the sheet since the last sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898613+github-actions[bot]@users.noreply.github.com"
          git add data/client-va-consult
          git commit -m "Sync Client & VA Consult sheet ($(date -u +%Y-%m-%d))"
          git push
